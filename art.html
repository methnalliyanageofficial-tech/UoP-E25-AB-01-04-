<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art</title>
  <link rel="stylesheet" href="art.style.css">
</head>
<body>

  <main class="container">
    <!-- Main Featured Video Player -->
    <section class="player-section">
      <div class="video-container">
        <iframe id="main-player" 
          src="https://www.youtube.com/embed/ooquLxKCI90?enablejsapi=1" 
          title="YouTube Video Player" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <h2 id="current-title" class="video-title">Speed Painting & Illustration</h2>
    </section>

    <!-- Video Grid Tiles -->
    <section class="grid-section">
      <div class="grid">
        
        <!-- Tile 1 -->
        <article class="tile" onclick="playVideo('ooquLxKCI90', 'Speed Painting & Illustration')">
          <div class="thumb-box">
            <img src="https://img.youtube.com/vi/ooquLxKCI90/hqdefault.jpg" alt="Speed Painting & Illustration">
            <div class="play-overlay"><span class="play-icon">▶</span></div>
          </div>
          <div class="tile-info">
            <h3>Speed Painting & Illustration</h3>
          </div>
        </article>

        <!-- Tile 2 -->
        <article class="tile" onclick="playVideo('VIDEO_ID_2', 'Digital Art Process')">
          <div class="thumb-box">
            <img src="https://img.youtube.com/vi/VIDEO_ID_2/hqdefault.jpg" alt="Digital Art Process">
            <div class="play-overlay"><span class="play-icon">▶</span></div>
          </div>
          <div class="tile-info">
            <h3>Digital Art Process</h3>
          </div>
        </article>

        <!-- Tile 3 -->
        <article class="tile" onclick="playVideo('VIDEO_ID_3', '3D Modeling & Animation')">
          <div class="thumb-box">
            <img src="https://img.youtube.com/vi/VIDEO_ID_3/hqdefault.jpg" alt="3D Modeling & Animation">
            <div class="play-overlay"><span class="play-icon">▶</span></div>
          </div>
          <div class="tile-info">
            <h3>3D Modeling & Animation</h3>
          </div>
        </article>

      </div>
    </section>
  </main>

  <script>
    function playVideo(videoId, title) {
      document.getElementById('main-player').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      document.getElementById('current-title').textContent = title;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
